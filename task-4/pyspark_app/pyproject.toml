[project]
name = "week13-pyspark-app"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyspark>=3.5,<4.0",
]

[dependency-groups]
dev = [
    "numpy==1.26.4",
    "pandas>=2.0,<3.0",
    "pyarrow>=12,<20",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
